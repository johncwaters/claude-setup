# Check-fix rerun arm: identical to config.yml (cap 50) so results compare directly
# against the batch A/B baseline; only PostHog capture is disabled (unset env var)
# so diagnostic reruns never blend into the dashboard's batch events.

model: claude-sonnet-5              # overridden per arm with --model
max_turns: 50
trials_per_cell: 2

regimes: [none, llms-txt, mcp, bundle]
headline_regimes: [none, bundle]

runs_per_batch_cap: 60
checks_timeout_secs: 600

token_budget:
  max_noncached_tokens_per_run: 500000

posthog:
  host: https://us.i.posthog.com
  project_api_key_env: EVALS_POSTHOG_CHECKFIX_CAPTURE_DISABLED
  personal_api_key_env: EVALS_POSTHOG_PERSONAL_KEY
  scratch_project_id_env: EVALS_POSTHOG_SCRATCH_PROJECT_ID
  keeplings_project_id_env: EVALS_POSTHOG_KEEPLINGS_PROJECT_ID
  mcp_url: https://mcp.posthog.com/mcp
  mcp_token_env: EVALS_POSTHOG_PERSONAL_KEY

bundles_dir: bundles
